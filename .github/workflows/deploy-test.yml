# Simple workflow for deploying static content to GitHub Pages
name: Deploy dev test to Pages

env:
  SITE_DIR: "portfolio"
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
         -[deploy]
  
# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
  workflow_dispatch:
    inputs:
      version:
        description: Version or branch name version.json 
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Write version.json
        run: |
          jq -n --arg v "$VERSION" '{version: $v}' > "$SITE_DIR/version.json"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.SITE_DIR }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Display deployed version
        run: echo "Stable Version Test Portfolio: $VERSION"
